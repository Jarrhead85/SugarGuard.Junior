[Unit]
# Бот не запускается раньше графического клиента Happ, однако собственный
# SugarGuard API доступен напрямую и не зависит от готовности VPN-туннеля.
Wants=happ-client.service
After=network-online.target happ-client.service
StartLimitIntervalSec=5min
StartLimitBurst=10

[Service]
# Явный bypass защищает старые HTTP-клиенты и служебные health-запросы от
# глобального HTTP_PROXY. Новый код бота дополнительно применяет handler
# без proxy к собственному API.
Environment="NO_PROXY=localhost,127.0.0.1,::1,api.sugar-guard.ru,.sugar-guard.ru"
Environment="no_proxy=localhost,127.0.0.1,::1,api.sugar-guard.ru,.sugar-guard.ru"
Restart=always
RestartSec=15s
TimeoutStopSec=30s
